name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove anything private from logs and screenshots
        (public IPs, hostnames, tokens, enrollment keys) before pasting them.
  - type: input
    id: version
    attributes:
      label: HomeXDR version
      description: Shown at the bottom of the console, or the image tag.
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Where does it happen?
      options: [Server or console, Windows agent, Linux agent, macOS agent, Docker or install, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server logs (`docker logs homexdr`) or the agent's log, trimmed to the relevant part.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Unraid 7, Docker 27, Windows 11 23H2, ...
