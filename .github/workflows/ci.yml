name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: shared, os: ubuntu-latest }
          - { module: server, os: ubuntu-latest }
          - { module: agent, os: ubuntu-latest }
          - { module: agent, os: windows-latest }
          - { module: agent, os: macos-latest } # Apple silicon
          - { module: agent, os: macos-15-intel }
    defaults:
      run:
        working-directory: ${{ matrix.module }}
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: vet other platforms
        if: matrix.module == 'agent' && runner.os == 'Linux'
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: install yara
        # The YARA scanner's service test drives the real yara and yarac tools.
        if: matrix.module == 'server'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yara
      - name: test
        run: go test ./...

  govulncheck:
    # Known vulnerabilities in Go dependencies and the standard library that the code
    # actually reaches. The agent is checked for each platform it ships on.
    name: Go vulnerabilities (${{ matrix.module }} ${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: shared, goos: linux }
          - { module: server, goos: linux }
          - { module: agent, goos: linux }
          - { module: agent, goos: windows }
          - { module: agent, goos: darwin }
    defaults:
      run:
        working-directory: ${{ matrix.module }}
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # The toolchain releases are built with (Dockerfile), so standard-library
          # findings are about what ships, not the oldest Go the modules accept.
          go-version: '1.27.x'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck
        env:
          GOOS: ${{ matrix.goos }} # the code is analysed for this platform; the tool runs on Linux
        run: "$(go env GOPATH)/bin/govulncheck ./..."

  clickhouse:
    name: Event store on ClickHouse
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: hxtest
          CLICKHOUSE_PASSWORD: hxtestpw
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
        ports: ["9000:9000"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8123/ping"
          --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - working-directory: server
        env:
          HOMEXDR_TEST_CLICKHOUSE_DSN: clickhouse://hxtest:hxtestpw@127.0.0.1:9000/homexdr_test
        run: go test -count=1 -run TestClickHouse -v ./internal/events

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg VERSION=ci --build-arg COMMIT=${GITHUB_SHA::7} -t homexdr/server:ci .
      - name: smoke test
        run: |
          docker run -d --name hx -e HOMEXDR_SERVER_NAMES=localhost -p 8080:8080 homexdr/server:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/setup/status
          docker logs hx
      - run: docker build -f deploy/yara/Dockerfile -t homexdr/yara:ci .
      - name: YARA scanner smoke test
        # Custom rules only: CI does not download the rule package.
        run: |
          mkdir -p /tmp/yr && echo 'rule CI_Marker { strings: $a = "CI-YARA-MARKER" condition: $a }' > /tmp/yr/ci.yar
          docker run -d --name yr -e YARA_FORGE_URL=off -v /tmp/yr:/rules:ro -p 3320:3320 homexdr/yara:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3320/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3320/status
          echo "x CI-YARA-MARKER x" | curl -fsS --data-binary @- http://127.0.0.1:3320/scan | grep -q CI_Marker
          docker logs yr
