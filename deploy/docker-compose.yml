# HomeXDR with ClickHouse. Copy .env.example to .env, edit it, then:
#   docker compose up -d --build
# To update automatically from git instead of rebuilding by hand, see deploy/update/.
name: homexdr

# Container log rotation, so Docker's own logs cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${HOMEXDR_LOG_MAX_SIZE:-10m}
    max-file: "${HOMEXDR_LOG_MAX_FILES:-3}"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: homexdr
      CLICKHOUSE_USER: homexdr
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      # A named volume by default; set HOMEXDR_CLICKHOUSE_DIR to a path to keep events
      # on a particular disk.
      - ${HOMEXDR_CLICKHOUSE_DIR:-clickhouse}:/var/lib/clickhouse
      - ./clickhouse/system-logs.xml:/etc/clickhouse-server/config.d/homexdr-system-logs.xml:ro
    # Uncomment to cap ClickHouse memory on a small box.
    # mem_limit: 4g
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    # Not published: only the HomeXDR server talks to ClickHouse.

  clamav:
    # Signature scanner for the antivirus (docs/antivirus.md). freshclam inside keeps the
    # signatures current. Remove this service (and HOMEXDR_CLAMD_ADDR) to go without file
    # scanning; hash lookups still work. Needs about 1.5 GB of memory.
    image: clamav/clamav:1.4.6
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
    volumes:
      - clamav:/var/lib/clamav
    mem_limit: 3g
    # Not published: only the HomeXDR server talks to it.

  yara:
    # YARA scanner for the antivirus, next to ClamAV (docs/antivirus.md). Downloads the
    # YARA Forge "core" rule package daily; put your own *.yar files in ./yara-rules.
    # Remove this service (and HOMEXDR_YARA_ADDR) to go without YARA. About 100 MB of memory.
    image: ${HOMEXDR_IMAGE_REGISTRY:-ghcr.io/netdoodle}/homexdr-yara:${HOMEXDR_VERSION:-v0.1.2}
    build:
      context: ..
      dockerfile: deploy/yara/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - yara:/var/lib/homexdr-yara
      - ./yara-rules:/rules:ro
    mem_limit: 1g
    # Not published: only the HomeXDR server talks to it.

  homexdr:
    # The published image for HOMEXDR_VERSION; `docker compose build` builds this checkout
    # under the same name instead.
    image: ${HOMEXDR_IMAGE_REGISTRY:-ghcr.io/netdoodle}/homexdr:${HOMEXDR_VERSION:-v0.1.2}
    build:
      context: ..
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      HOMEXDR_EVENT_STORE: clickhouse
      HOMEXDR_CLICKHOUSE_DSN: clickhouse://homexdr:${CLICKHOUSE_PASSWORD}@clickhouse:9000/homexdr
      HOMEXDR_SERVER_NAMES: ${HOMEXDR_SERVER_NAMES:?set HOMEXDR_SERVER_NAMES in .env}
      HOMEXDR_AGENT_URL: ${HOMEXDR_AGENT_URL:-}
      # Certificate-only agent listener for a port forward (docs/away-from-home.md).
      HOMEXDR_AGENT_EXTERNAL_ADDR: ${HOMEXDR_AGENT_EXTERNAL_ADDR:-}
      # Storage limits. Events older than HOMEXDR_RETENTION_DAYS are deleted (0 = keep
      # forever). HOMEXDR_RETENTION_MAX_SIZE also caps the event store on disk, for example
      # 500GB or 250GiB: when it is reached the oldest days go first. Whichever limit is hit
      # first wins. Empty = no size cap.
      HOMEXDR_RETENTION_DAYS: ${HOMEXDR_RETENTION_DAYS:-30}
      HOMEXDR_RETENTION_MAX_SIZE: ${HOMEXDR_RETENTION_MAX_SIZE:-}
      HOMEXDR_SECURE_COOKIES: ${HOMEXDR_SECURE_COOKIES:-false}
      # Console over HTTPS, off unless HOMEXDR_CONSOLE_HTTPS_ADDR is set (docs/console-https.md).
      HOMEXDR_CONSOLE_HTTPS_ADDR: ${HOMEXDR_CONSOLE_HTTPS_ADDR:-}
      HOMEXDR_CONSOLE_TLS_CERT: ${HOMEXDR_CONSOLE_TLS_CERT:-}
      HOMEXDR_CONSOLE_TLS_KEY: ${HOMEXDR_CONSOLE_TLS_KEY:-}
      HOMEXDR_CONSOLE_HTTP_REDIRECT: ${HOMEXDR_CONSOLE_HTTP_REDIRECT:-false}
      # The redirect points at the published port below.
      HOMEXDR_CONSOLE_HTTPS_PUBLIC_PORT: ${HOMEXDR_CONSOLE_HTTPS_PORT:-8448}
      HOMEXDR_TRUSTED_PROXIES: ${HOMEXDR_TRUSTED_PROXIES:-}
      HOMEXDR_SYSLOG_ALLOW: ${HOMEXDR_SYSLOG_ALLOW:-}
      # NetFlow/IPFIX receiver, off unless HOMEXDR_NETFLOW_ADDR is set (see docs/network-visibility.md).
      HOMEXDR_NETFLOW_ADDR: ${HOMEXDR_NETFLOW_ADDR:-}
      HOMEXDR_NETFLOW_ALLOW: ${HOMEXDR_NETFLOW_ALLOW:-}
      # ClamAV daemon for the antivirus (the clamav service above).
      HOMEXDR_CLAMD_ADDR: ${HOMEXDR_CLAMD_ADDR:-clamav:3310}
      # YARA scanner for the antivirus (the yara service above).
      HOMEXDR_YARA_ADDR: ${HOMEXDR_YARA_ADDR:-yara:3320}
      # Optional AI analyst API keys (otherwise set them in the console).
      HOMEXDR_ANTHROPIC_API_KEY: ${HOMEXDR_ANTHROPIC_API_KEY:-}
      HOMEXDR_OPENAI_API_KEY: ${HOMEXDR_OPENAI_API_KEY:-}
      HOMEXDR_GEMINI_API_KEY: ${HOMEXDR_GEMINI_API_KEY:-}
      HOMEXDR_LOCAL_AI_API_KEY: ${HOMEXDR_LOCAL_AI_API_KEY:-}
      HOMEXDR_LOG_LEVEL: ${HOMEXDR_LOG_LEVEL:-info}
    ports:
      - "${HOMEXDR_CONSOLE_PORT:-8080}:8080/tcp"
      - "${HOMEXDR_CONSOLE_HTTPS_PORT:-8448}:8448/tcp"
      - "${HOMEXDR_AGENT_PORT:-8443}:8443/tcp"
      - "${HOMEXDR_AGENT_EXTERNAL_PORT:-8444}:8444/tcp"
      - "${HOMEXDR_SYSLOG_PORT:-514}:5514/udp"
      - "${HOMEXDR_SYSLOG_PORT:-514}:5514/tcp"
      - "${HOMEXDR_NETFLOW_PORT:-2055}:2055/udp"
    volumes:
      # Certificates, settings and (lite) the database. A named volume by default; set
      # HOMEXDR_DATA_DIR to a path to keep them on a particular disk.
      - ${HOMEXDR_DATA_DIR:-data}:/data
      # Agent release signatures and the release public key, written by the host's update
      # script (deploy/update). Read-only: the server never holds the signing key.
      - ${HOMEXDR_SIGNATURES_DIR:-./signatures}:/usr/share/homexdr/signatures:ro
      # Optional extra Sigma rules, see rules/README.md:
      # - /opt/sigma/rules/windows/process_creation:/usr/share/homexdr/rules/sigmahq/windows:ro

volumes:
  clickhouse:
  clamav:
  yara:
  data:
