title: HomeXDR Agent Stopped Or Removed On macOS
id: 13f1c27b-0f2e-4026-990c-6f05ce5eebcc
status: experimental
description: |
  A command stopped, unloaded, killed or uninstalled the HomeXDR agent. Intruders blind
  the monitoring first. Watch for the host going quiet right after.
author: HomeXDR
date: 2026-11-12
references:
  - https://attack.mitre.org/techniques/T1562/001/
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    CommandLine|re:
      - '\b(?:pkill|killall)\b.*homexdr-agent'
      - '\blaunchctl\s+(?:bootout|unload|disable|kill|remove)\b.*com\.homexdr\.agent'
      - 'homexdr-agent\s+uninstall\b'
      - '\brm\s+-\S*\s+\S*(?:homexdr-agent|com\.homexdr\.agent\.plist)'
  condition: selection
falsepositives:
  - You removing or restarting the agent by hand
level: high
