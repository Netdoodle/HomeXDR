title: Archive Uploaded With Curl From A Temporary Folder On macOS
id: a174cae3-ea6c-41bc-8106-bbbdd418363e
status: experimental
description: |
  curl uploaded a zip or tar archive straight out of /tmp, /var/folders or /Users/Shared.
  This is how most macOS infostealers send what they collected: everything is copied
  into a temporary folder, zipped and posted to the attacker's server.
author: HomeXDR
date: 2026-11-25
references:
  - https://attack.mitre.org/techniques/T1041/
  - https://attack.mitre.org/techniques/T1560/001/
tags:
  - attack.exfiltration
  - attack.t1041
  - attack.collection
  - attack.t1560.001
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: '/curl'
    CommandLine|re:
      - '(?:-F|--form)\s+["'']?[\w.-]*=@["'']?(?:/private)?/(?:tmp|var/tmp|var/folders|Users/Shared)/\S+\.(?:zip|tar|tgz|gz|7z)\b'
      - '(?:--data-binary|--upload-file|-T)\s+["'']?@?(?:/private)?/(?:tmp|var/tmp|var/folders|Users/Shared)/\S+\.(?:zip|tar|tgz|gz|7z)\b'
  condition: selection
falsepositives:
  - Scripts that upload build output or logs from a temporary folder
level: medium
